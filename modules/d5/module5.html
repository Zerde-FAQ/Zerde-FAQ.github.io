<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>5 Модуль - Дәлел</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Защита от выделения текста и контента */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #ffffff; /* Чисто белый фон */
            color: #1e293b;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Clean White Minimalist Glass Style */
        .clean-glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03), inset 0 1px 0 rgba(255, 255, 255, 1);
        }

        .clean-card {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.06);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Smooth page transition animation */
        @keyframes pageSlide {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .animate-page-slide {
            animation: pageSlide 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Self-typing cursor */
        .typing-cursor::after {
            content: '|';
            animation: blink 0.8s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Massive Rotating Ornament with White Chromakey Removal */
        @keyframes spinOrnament {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .rotating-ornament {
            animation: spinOrnament 40s linear infinite;
            mix-blend-mode: multiply; /* Хромакей белого фона */
            filter: contrast(110%);
        }

        /* Soft Ripple Animation for Speaker */
        @keyframes liquidRipple {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.3);
            }
            70% {
                transform: scale(1.2);
                box-shadow: 0 0 0 20px rgba(37, 99, 235, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(37, 99, 235, 0);
            }
        }
        .ripple-effect {
            animation: liquidRipple 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Shake and Red Flash Animation when audio is locked */
        @keyframes shakeRed {
            0%, 100% { transform: translateX(0); background-color: #2563eb; }
            20%, 60% { transform: translateX(-5px); background-color: #dc2626; }
            40%, 80% { transform: translateX(5px); background-color: #dc2626; }
        }
        .shake-error {
            animation: shakeRed 0.8s ease-in-out;
        }

        /* Smooth Fullscreen Loading Curtain */
        #loadingCurtain {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }
        #loadingCurtain.active {
            opacity: 1;
            pointer-events: auto;
        }

        #f12Modal {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="flex flex-col justify-between p-4 sm:p-6 md:p-8 relative">

    <!-- Soft Background Music (km.wav, 20% volume) -->
    <audio id="bgMusic" src="km.wav" loop preload="auto"></audio>

    <!-- Soft Loading Curtain for Back Navigation -->
    <div id="loadingCurtain" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
        <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-3"></div>
        <span class="text-slate-600 text-sm font-medium tracking-wide">Жүктелуде...</span>
    </div>

    <!-- Protected Modal Warning (Classic Lock Style) -->
    <div id="f12Modal" class="fixed inset-0 z-50 bg-slate-900/30 backdrop-blur-md flex items-center justify-center opacity-0 pointer-events-none p-4">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl border border-slate-100 text-center transform scale-90 transition-all duration-300">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-2">Қорғалған жүйе</h3>
            <p class="text-sm text-slate-600 leading-relaxed font-medium mb-6">Бастапқы код жабық. Хабарлама 3 секундтан кейін жабылады...</p>
            <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                <div id="modalProgress" class="bg-blue-600 h-full w-full transition-all duration-3000 ease-linear rounded-full"></div>
            </div>
        </div>
    </div>

    <!-- Image Zoom Modal (Minimalist) -->
    <div id="imageModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex flex-col items-center justify-center opacity-0 pointer-events-none transition-all duration-300 p-3 sm:p-6">
        <!-- Toolbar -->
        <div class="bg-white/95 backdrop-blur-md px-4 py-3 rounded-2xl shadow-2xl flex flex-wrap items-center justify-center gap-2 sm:gap-3 mb-3 border border-slate-200 z-10 max-w-lg w-full">
            <button onclick="zoomModalImage(0.25)" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-medium transition-colors cursor-pointer" title="Үлкейту"><i class="fa-solid fa-magnifying-glass-plus mr-1"></i> Үлкейту</button>
            <button onclick="zoomModalImage(-0.25)" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-medium transition-colors cursor-pointer" title="Кішірейту"><i class="fa-solid fa-magnifying-glass-minus mr-1"></i> Кішірейту</button>
            <button onclick="resetZoom()" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-medium transition-colors cursor-pointer">Бастапқы</button>
            
            <div class="h-6 w-[1px] bg-slate-300 mx-1"></div>

            <button onclick="saveModalImage()" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-medium shadow-md shadow-blue-500/20 transition-all cursor-pointer"><i class="fa-solid fa-download mr-1"></i> Сақтау</button>
            <button onclick="closeImageModal()" class="w-8 h-8 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-full flex items-center justify-center transition-colors cursor-pointer ml-auto"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- Image Container -->
        <div id="imageWrapper" class="relative overflow-auto max-w-full max-h-[75vh] rounded-2xl shadow-2xl bg-white border border-slate-200 flex items-center justify-center p-4">
            <img id="modalImage" src="" alt="Жауап" class="transition-transform duration-200 object-contain max-h-[70vh] origin-center">
        </div>
    </div>

    <!-- Extra Large Rotating Kazakh Ornament (ojy.jpg) -->
    <div class="fixed -bottom-24 -left-24 sm:-bottom-32 sm:-left-32 md:-bottom-40 md:-left-40 z-0 pointer-events-none opacity-75">
        <img src="ojy.jpg" alt="Қазақ орнаменті" class="w-[350px] h-[350px] sm:w-[500px] sm:h-[500px] md:w-[650px] md:h-[650px] object-contain rotating-ornament" onerror="this.style.display='none';">
    </div>

    <!-- Audio Elements (100% volume, exact paths) -->
    <audio id="audio-1" src="m1/audio.mp3" preload="auto"></audio>
    <audio id="audio-2" src="m2/audio.mp3" preload="auto"></audio>
    <audio id="audio-3" src="m3/audio.mp3" preload="auto"></audio>
    <audio id="audio-4" src="m4/audio.mp3" preload="auto"></audio>

    <!-- Clean Minimalist Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 left-5 sm:left-auto z-50 transform translate-y-[-150%] opacity-0 transition-all duration-300 bg-white/95 backdrop-blur-md text-slate-800 border border-slate-200/80 px-5 py-3.5 rounded-2xl shadow-xl flex items-center space-x-3 text-sm font-medium">
        <i class="fa-solid fa-circle-exclamation text-amber-500 text-lg"></i>
        <span id="toast-message">Ағымдағы аудиофайл аяқталғанша күтіңіз.</span>
    </div>

    <!-- Top Bar: Back Button -->
    <header class="w-full max-w-7xl mx-auto flex justify-start items-center mb-4 relative z-10">
        <button onclick="goBackToRoot(event)" class="clean-glass hover:bg-slate-50 text-slate-700 font-medium px-5 py-2.5 rounded-2xl shadow-sm transition-all duration-300 hover:scale-105 active:scale-95 flex items-center cursor-pointer">
            <i class="fa-solid fa-arrow-left mr-2"></i> Кері
        </button>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-7xl mx-auto flex flex-col items-center my-auto py-2 relative z-10">
        
        <!-- Self-Typing Title (Roboto, size 24+ on desktop) -->
        <h1 id="typingTitle" class="text-2xl sm:text-3xl md:text-[28px] font-bold text-slate-800 mb-8 tracking-tight text-center typing-cursor">
            5 Модуль - Дәлел
        </h1>

        <!-- Cards Viewport with Navigation Arrows -->
        <div class="relative w-full flex items-center justify-center px-6 sm:px-12">
            
            <!-- Left Arrow Button (Mobile Adapted) -->
            <button onclick="prevPage()" class="absolute left-0 z-20 clean-glass w-10 h-10 sm:w-14 sm:h-14 rounded-full flex items-center justify-center text-blue-600 shadow-md hover:scale-110 active:scale-95 transition-all cursor-pointer">
                <i class="fa-solid fa-chevron-left text-base sm:text-xl"></i>
            </button>

            <!-- 3 Columns Larger Grid Container -->
            <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6 sm:gap-8 w-full max-w-6xl mx-6 sm:mx-12 items-center">
                <!-- Dynamically injected with animation -->
            </div>

            <!-- Right Arrow Button (Mobile Adapted) -->
            <button onclick="nextPage()" class="absolute right-0 z-20 clean-glass w-10 h-10 sm:w-14 sm:h-14 rounded-full flex items-center justify-center text-blue-600 shadow-md hover:scale-110 active:scale-95 transition-all cursor-pointer">
                <i class="fa-solid fa-chevron-right text-base sm:text-xl"></i>
            </button>

        </div>

        <!-- Dots Indicator -->
        <div id="dotsContainer" class="flex space-x-2.5 mt-8">
            <!-- Dynamically injected -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-7xl mx-auto text-center py-4 relative z-10">
        <a href="https://zerde-faq.github.io" target="_self" class="inline-flex items-center text-xs sm:text-sm font-medium text-slate-500 hover:text-blue-600 transition-colors">
            <i class="fa-solid fa-paperclip mr-1.5 text-slate-400"></i> zerde-faq.github.io
        </a>
    </footer>

    <!-- Script Logic -->
    <script>
        // Start Background Music (km.wav) at 20% Volume with browser unlock logic
        window.addEventListener('load', () => {
            const bgMusic = document.getElementById('bgMusic');
            bgMusic.volume = 0.2; // Мягкие 20% громкости
            
            const startMusic = () => {
                bgMusic.play().then(() => {
                    document.removeEventListener('click', startMusic);
                    document.removeEventListener('touchstart', startMusic);
                }).catch(() => {});
            };

            bgMusic.play().catch(() => {
                document.addEventListener('click', startMusic);
                document.addEventListener('touchstart', startMusic);
            });
        });

        // Self-typing title effect
        const titleText = "5 Модуль - Дәлел";
        const titleEl = document.getElementById('typingTitle');
        let charIndex = 0;

        function typeTitle() {
            titleEl.textContent = "";
            let timer = setInterval(() => {
                if (charIndex < titleText.length) {
                    titleEl.textContent += titleText.charAt(charIndex);
                    charIndex++;
                } else {
                    clearInterval(timer);
                    titleEl.classList.remove('typing-cursor');
                }
            }, 70);
        }
        window.addEventListener('load', typeTitle);

        // Pages data structures (m1 использует 1n.png)
        const pagesData = [
            [
                { img: 'm1/1n.png', answerImg: 'm1/2.png', audio: 1 },
                { img: 'm2/1.png', answerImg: 'm2/2.jpeg', audio: 2 },
                { img: 'm3/1.png', answerImg: 'm3/2.jpeg', audio: 3 }
            ],
            [
                { img: 'm4/1.png', answerImg: 'm4/2.jpeg', audio: 4 },
                { img: 'm1/1n.png', answerImg: 'm1/2.png', audio: 1 },
                { img: 'm2/1.png', answerImg: 'm2/2.jpeg', audio: 2 }
            ]
        ];

        let currentPage = 0;

        function renderPages() {
            const grid = document.getElementById('cardsGrid');
            const dotsContainer = document.getElementById('dotsContainer');
            
            grid.innerHTML = '';
            dotsContainer.innerHTML = '';

            grid.classList.remove('animate-page-slide');
            void grid.offsetWidth;
            grid.classList.add('animate-page-slide');

            const currentCards = pagesData[currentPage];
            currentCards.forEach((cardData) => {
                grid.innerHTML += `
                    <div class="clean-card rounded-[28px] p-5 flex flex-col items-center justify-between shadow-xl relative overflow-hidden group hover:scale-[1.02]">
                        <img src="${cardData.img}" alt="Card ${cardData.audio}" class="w-full h-auto object-contain rounded-2xl shadow-sm mb-3 pointer-events-none" onerror="this.onerror=null; this.src='https://api.qrserver.com/v1/create-qr-code/?size=250x300&data=Missing+${cardData.img}';">
                        
                        <!-- Smooth Answer Container -->
                        <div class="answer-container w-full max-h-0 overflow-hidden transition-all duration-500 ease-in-out opacity-0 mb-3">
                            <img src="${cardData.answerImg}" alt="Жауап" onclick="openImageModal('${cardData.answerImg}')" class="w-full h-auto object-contain rounded-2xl shadow-sm border border-emerald-200 cursor-zoom-in hover:brightness-105 transition-all" onerror="this.onerror=null; this.src='https://api.qrserver.com/v1/create-qr-code/?size=250x300&data=Missing+${cardData.answerImg}';">
                        </div>

                        <div class="w-full flex justify-between items-center px-2 pt-2 border-t border-slate-100">
                            <!-- Green Жауап Button -->
                            <button onclick="toggleAnswer(this)" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-full font-medium text-sm flex items-center shadow-md shadow-emerald-500/20 active:scale-95 transition-all cursor-pointer">
                                <i class="fa-solid fa-eye mr-2"></i> Жауап
                            </button>
                            <!-- Audio Button -->
                            <button onclick="playAudio(${cardData.audio}, this)" class="w-12 h-12 bg-blue-600 text-white rounded-full flex items-center justify-center shadow-lg shadow-blue-500/30 hover:bg-blue-700 active:scale-95 transition-all cursor-pointer">
                                <i class="fa-solid fa-volume-high text-lg"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            pagesData.forEach((_, pIdx) => {
                dotsContainer.innerHTML += `
                    <button onclick="goToPage(${pIdx})" class="h-3 rounded-full transition-all duration-300 ${pIdx === currentPage ? 'bg-blue-600 w-8' : 'bg-slate-300 w-3'}"></button>
                `;
            });
        }

        // Toggle Answer Function
        function toggleAnswer(btn) {
            const card = btn.closest('.clean-card');
            const answerContainer = card.querySelector('.answer-container');
            const isOpen = answerContainer.style.maxHeight && answerContainer.style.maxHeight !== '0px';

            if (isOpen) {
                answerContainer.style.maxHeight = '0px';
                answerContainer.style.opacity = '0';
                btn.innerHTML = '<i class="fa-solid fa-eye mr-2"></i> Жауап';
                btn.classList.remove('bg-emerald-700');
                btn.classList.add('bg-emerald-600');
            } else {
                answerContainer.style.maxHeight = '600px';
                answerContainer.style.opacity = '1';
                btn.innerHTML = '<i class="fa-solid fa-eye-slash mr-2"></i> Жасыру';
                btn.classList.remove('bg-emerald-600');
                btn.classList.add('bg-emerald-700');
            }
        }

        // --- Image Zoom Modal Logic ---
        const imageModal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');
        let currentScale = 1;

        function openImageModal(imgSrc) {
            modalImg.src = imgSrc;
            currentScale = 1;
            modalImg.style.transform = `scale(${currentScale})`;
            imageModal.classList.remove('opacity-0', 'pointer-events-none');
            imageModal.classList.add('opacity-100');
        }

        function closeImageModal() {
            imageModal.classList.remove('opacity-100');
            imageModal.classList.add('opacity-0', 'pointer-events-none');
        }

        function zoomModalImage(delta) {
            currentScale = Math.max(0.5, Math.min(3.0, currentScale + delta));
            modalImg.style.transform = `scale(${currentScale})`;
        }

        function resetZoom() {
            currentScale = 1;
            modalImg.style.transform = `scale(${currentScale})`;
        }

        function saveModalImage() {
            const link = document.createElement('a');
            link.download = 'jawap-image.png';
            link.href = modalImg.src;
            link.click();
            showToast("Сурет сәтті сақталды! 📥");
        }

        function nextPage() {
            currentPage = (currentPage + 1) % pagesData.length;
            renderPages();
        }

        function prevPage() {
            currentPage = (currentPage - 1 + pagesData.length) % pagesData.length;
            renderPages();
        }

        function goToPage(pIdx) {
            currentPage = pIdx;
            renderPages();
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderPages();
        });

        // Smart Back Button
        function goBackToRoot(event) {
            event.preventDefault();
            const curtain = document.getElementById('loadingCurtain');
            curtain.classList.add('active');

            setTimeout(() => {
                window.location.href = 'https://zerde-faq.github.io';
            }, 450);
        }

        // Toast Notification Function
        function showToast(message) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            msgEl.textContent = message;
            
            toast.classList.remove('translate-y-[-150%]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-150%]', 'opacity-0');
            }, 3000);
        }

        // Active Audio State Management
        let activeAudio = null;

        // 100% Volume Audio Playback with Smart Protection & Shake/Red Flash Animation
        function playAudio(num, btnElement) {
            if (activeAudio && !activeAudio.paused && !activeAudio.ended) {
                showToast("Ағымдағы аудиофайл аяқталғанша күтіңіз.");
                
                btnElement.classList.add('shake-error');
                setTimeout(() => {
                    btnElement.classList.remove('shake-error');
                }, 800);
                return;
            }

            const audio = document.getElementById(`audio-${num}`);
            if (audio) {
                activeAudio = audio;
                audio.currentTime = 0;
                audio.volume = 1.0;

                btnElement.classList.add('ripple-effect');
                setTimeout(() => btnElement.classList.remove('ripple-effect'), 800);

                audio.play().then(() => {
                    showToast(`${num}-аудио файл ойнатылуда 🎧`);
                }).catch(err => {
                    console.log("Audio error:", err);
                    showToast("Аудио файлды ойнату мүмкін болмады", false);
                    activeAudio = null;
                });

                audio.onended = () => {
                    activeAudio = null;
                };
            }
        }

        // Copy / Drag / Context Menu Protection
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());

        // F12 & DevTools Protection
        let isModalActive = false;
        function triggerF12Warning() {
            if (isModalActive) return;
            isModalActive = true;

            const modal = document.getElementById('f12Modal');
            const progressBar = document.getElementById('modalProgress');

            // Show modal
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100');
            modal.querySelector('div').classList.remove('scale-90');
            modal.querySelector('div').classList.add('scale-100');

            // Start Progress bar
            progressBar.style.width = '100%';
            setTimeout(() => {
                progressBar.style.width = '0%';
            }, 50);

            // Hide modal after 3 seconds
            setTimeout(() => {
                modal.classList.remove('opacity-100');
                modal.classList.add('opacity-0', 'pointer-events-none');
                modal.querySelector('div').classList.remove('scale-100');
                modal.querySelector('div').classList.add('scale-90');
                isModalActive = false;
            }, 3000);
        }

        document.addEventListener('keydown', e => {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) ||
                (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
            ) {
                e.preventDefault();
                triggerF12Warning();
            }
        });
    </script>
</body>
</html>
