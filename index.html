<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Модульді таңдаңыз</title>
    
    <!-- Favicon -->
    <link rel="icon" href="icon.ico" type="image/x-icon">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Защита от выделения текста и контента */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #ffffff;
            color: #1e293b;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* iOS Liquid Glass Style (в меру, стильно и воздушно) */
        .ios-glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.65));
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.04), inset 0 1px 1px rgba(255, 255, 255, 1);
        }

        .clean-card {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.06);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Smooth page transition animation */
        @keyframes pageSlide {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .animate-page-slide {
            animation: pageSlide 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Massive Rotating Ornament with White Chromakey Removal */
        @keyframes spinOrnament {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .rotating-ornament {
            animation: spinOrnament 40s linear infinite;
            mix-blend-mode: multiply;
            filter: contrast(110%);
        }

        /* Fullscreen Loading Curtain for Transitions */
        #loadingCurtain {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }
        #loadingCurtain.active {
            opacity: 1;
            pointer-events: auto;
        }

        #f12Modal {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Soft pulsing animation */
        @keyframes softPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 12px 35px rgba(0,0,0,0.04); }
            50% { transform: scale(1.03); box-shadow: 0 16px 40px rgba(59, 130, 246, 0.12); }
        }
        .animated-question-btn {
            animation: softPulse 3s ease-in-out infinite;
        }

        /* Back-and-forth sliding text animation */
        @keyframes slideTextLoop {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(12px); }
        }
        .animate-sliding-text {
            display: inline-block;
            animation: slideTextLoop 3.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="flex flex-col justify-between p-4 sm:p-6 md:p-8 relative">

    <!-- Soft Background Music (km.wav, 20% volume) -->
    <audio id="bgMusic" src="km.wav" loop preload="auto"></audio>

    <!-- Smooth Fullscreen Loading Curtain -->
    <div id="loadingCurtain" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
        <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-3"></div>
        <span class="text-slate-600 text-sm font-medium tracking-wide">Жүктелуде...</span>
    </div>

    <!-- Protected Modal Warning (F12 Lock) -->
    <div id="f12Modal" class="fixed inset-0 z-50 bg-slate-900/30 backdrop-blur-md flex items-center justify-center opacity-0 pointer-events-none p-4">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl border border-slate-100 text-center transform scale-90 transition-all duration-300">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-2">Қорғалған жүйе</h3>
            <p class="text-sm text-slate-600 leading-relaxed font-medium mb-6">Бастапқы код жабық. Хабарлама 3 секундтан кейін жабылады...</p>
            <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                <div id="modalProgress" class="bg-blue-600 h-full w-full transition-all duration-3000 ease-linear rounded-full"></div>
            </div>
        </div>
    </div>

    <!-- Extra Large Rotating Kazakh Ornament (ojy.jpg) -->
    <div class="fixed -bottom-24 -left-24 sm:-bottom-32 sm:-left-32 md:-bottom-40 md:-left-40 z-0 pointer-events-none opacity-75">
        <img src="ojy.jpg" alt="Қазақ орнаменті" class="w-[350px] h-[350px] sm:w-[500px] sm:h-[500px] md:w-[650px] md:h-[650px] object-contain rotating-ornament" onerror="this.style.display='none';">
    </div>

    <!-- Top Bar: iOS Liquid Glass Controls -->
    <header class="w-full max-w-7xl mx-auto flex justify-end items-center gap-3 mb-2 relative z-10">
        <!-- Animated Review Button with Flag Icon and Sliding Text -->
        <button onclick="navigateTo('reportabuse.html')" class="ios-glass px-4 py-2.5 sm:px-5 sm:h-12 rounded-full transition-all duration-300 hover:scale-105 active:scale-95 flex items-center space-x-2 cursor-pointer text-slate-700 hover:text-blue-600 overflow-hidden max-w-[200px] sm:max-w-[260px]" title="Пікір қалдыру / Мәселе туралы хабарлау">
            <i class="fa-solid fa-flag text-blue-600 text-sm sm:text-base shrink-0"></i>
            <span class="text-xs sm:text-sm font-medium whitespace-nowrap overflow-hidden">
                <span class="animate-sliding-text">Оставить отзыв \ Мәселе...</span>
            </span>
        </button>

        <!-- Soft Animated Question Mark Button -->
        <button onclick="navigateTo('modules/qr/qr_index.html')" class="ios-glass animated-question-btn w-11 h-11 sm:w-12 sm:h-12 rounded-full transition-all duration-300 hover:scale-110 active:scale-95 flex items-center justify-center cursor-pointer text-slate-700 hover:text-blue-600" title="Көмек / Сұрақ">
            <i class="fa-solid fa-question text-lg sm:text-xl"></i>
        </button>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-7xl mx-auto flex flex-col items-center my-auto py-2 relative z-10">
        
        <!-- Main Title -->
        <h1 class="text-2xl sm:text-3xl md:text-[32px] font-bold text-slate-800 mb-8 tracking-tight text-center">
            Модульді таңдаңыз:
        </h1>

        <!-- Cards Viewport with Navigation Arrows -->
        <div class="relative w-full flex items-center justify-center px-6 sm:px-12">
            
            <!-- Left Arrow Button -->
            <button onclick="prevPage()" class="absolute left-0 z-25 ios-glass w-10 h-10 sm:w-14 sm:h-14 rounded-full flex items-center justify-center text-blue-600 hover:scale-110 active:scale-95 transition-all cursor-pointer shadow-md">
                <i class="fa-solid fa-chevron-left text-base sm:text-xl"></i>
            </button>

            <!-- 3 Columns Grid Container -->
            <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6 sm:gap-8 w-full max-w-6xl mx-6 sm:mx-12 items-center">
                <!-- Dynamically injected with animation -->
            </div>

            <!-- Right Arrow Button -->
            <button onclick="nextPage()" class="absolute right-0 z-25 ios-glass w-10 h-10 sm:w-14 sm:h-14 rounded-full flex items-center justify-center text-blue-600 hover:scale-110 active:scale-95 transition-all cursor-pointer shadow-md">
                <i class="fa-solid fa-chevron-right text-base sm:text-xl"></i>
            </button>

        </div>

        <!-- Dots Indicator -->
        <div id="dotsContainer" class="flex space-x-2.5 mt-8">
            <!-- Dynamically injected -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-7xl mx-auto text-center py-4 relative z-10">
        <a href="https://zerde-faq.github.io" target="_self" class="inline-flex items-center text-xs sm:text-sm font-medium text-slate-500 hover:text-blue-600 transition-colors">
            <i class="fa-solid fa-paperclip mr-1.5 text-slate-400"></i> zerde-faq.github.io
        </a>
    </footer>

    <!-- Script Logic -->
    <script>
        // Start Background Music (km.wav) at 20% Volume with browser unlock logic
        window.addEventListener('load', () => {
            const bgMusic = document.getElementById('bgMusic');
            bgMusic.volume = 0.2;
            
            const startMusic = () => {
                bgMusic.play().then(() => {
                    document.removeEventListener('click', startMusic);
                    document.removeEventListener('touchstart', startMusic);
                }).catch(() => {});
            };

            bgMusic.play().catch(() => {
                document.addEventListener('click', startMusic);
                document.addEventListener('touchstart', startMusic);
            });
        });

        // Modules Data by Pages (including Module 4)
        const pagesData = [
            // Page 1
            [
                { img: '1.png', link: 'modules/a1/module1.html' },
                { img: '2.png', link: 'modules/n2/module2.html' },
                { img: '3.png', link: 'modules/q3/module3.html' }
            ],
            // Page 2
            [
                { img: '4.png', link: 'modules/k4/module4.html' },
                { img: '5.png', link: 'modules/d5/module5.html' },
                { img: '6.png', link: 'modules/t6/module6.html' }
            ]
        ];

        let currentPage = 0;

        function renderPages() {
            const grid = document.getElementById('cardsGrid');
            const dotsContainer = document.getElementById('dotsContainer');
            
            grid.innerHTML = '';
            dotsContainer.innerHTML = '';

            grid.classList.remove('animate-page-slide');
            void grid.offsetWidth; // Reflow
            grid.classList.add('animate-page-slide');

            const currentCards = pagesData[currentPage];
            currentCards.forEach((cardData) => {
                grid.innerHTML += `
                    <div onclick="navigateTo('${cardData.link}')" class="clean-card rounded-[28px] p-5 flex flex-col items-center justify-center shadow-xl relative overflow-hidden cursor-pointer hover:scale-[1.05] active:scale-[0.98]">
                        <img src="${cardData.img}" alt="Module" class="w-full h-auto object-contain rounded-2xl shadow-sm pointer-events-none" onerror="this.onerror=null; this.src='https://api.qrserver.com/v1/create-qr-code/?size=250x300&data=Missing+${cardData.img}';">
                    </div>
                `;
            });

            pagesData.forEach((_, pIdx) => {
                dotsContainer.innerHTML += `
                    <button onclick="goToPage(${pIdx})" class="h-3 rounded-full transition-all duration-300 ${pIdx === currentPage ? 'bg-blue-600 w-8' : 'bg-slate-300 w-3'}"></button>
                `;
            });
        }

        function nextPage() {
            currentPage = (currentPage + 1) % pagesData.length;
            renderPages();
        }

        function prevPage() {
            currentPage = (currentPage - 1 + pagesData.length) % pagesData.length;
            renderPages();
        }

        function goToPage(pIdx) {
            currentPage = pIdx;
            renderPages();
        }

        // Smooth Page Navigation without opening new tabs
        function navigateTo(url) {
            const curtain = document.getElementById('loadingCurtain');
            curtain.classList.add('active');

            setTimeout(() => {
                window.location.href = url;
            }, 450);
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderPages();
        });

        // Copy / Drag / Context Menu Protection
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());

        // F12 & DevTools Protection
        let isModalActive = false;
        function triggerF12Warning() {
            if (isModalActive) return;
            isModalActive = true;

            const modal = document.getElementById('f12Modal');
            const progressBar = document.getElementById('modalProgress');

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100');
            modal.querySelector('div').classList.remove('scale-90');
            modal.querySelector('div').classList.add('scale-100');

            progressBar.style.width = '100%';
            setTimeout(() => {
                progressBar.style.width = '0%';
            }, 50);

            setTimeout(() => {
                modal.classList.remove('opacity-100');
                modal.classList.add('opacity-0', 'pointer-events-none');
                modal.querySelector('div').classList.remove('scale-100');
                modal.querySelector('div').classList.add('scale-90');
                isModalActive = false;
            }, 3000);
        }

        document.addEventListener('keydown', e => {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) ||
                (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
            ) {
                e.preventDefault();
                triggerF12Warning();
            }
        });
    </script>
</body>
</html>
